<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF Library</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 My PDF Library</h1>
        <p>Important documents & files</p>
    </header>

    <main>

        <div class="pdf-card">

            <div class="pdf-icon">
                📄
            </div>

            <div class="pdf-info">
                <h2>Important Document.pdf</h2>
                <p>PDF • 2.4 MB</p>
            </div>

            <button onclick="startDownload()">
                ⬇ Download PDF
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
